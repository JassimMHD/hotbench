name: Adapter or converter request
description: Ask for a model, format or backend to be supported, or a conversion (e.g. to ONNX)
labels: [adapter-request]
body:
  - type: input
    id: model
    attributes:
      label: Model, format or backend
      placeholder: e.g. "RT-DETRv2 via transformers", "whisper.cpp", "GGUF via llama.cpp"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What do you need?
      options:
        - Run this model (adapter)
        - Convert this model to another format (converter)
        - Both
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target format, if converting
      placeholder: e.g. ONNX, OpenVINO, TensorRT, GGUF, CoreML, INT8
  - type: dropdown
    id: task
    attributes:
      label: Task
      options: [detect, segment, pose, classify, count, ASR, TTS, VAD, chat (LLM), VLM, other]
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to the model or library, and its licence
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What do you want to measure or test with it?
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'd like to write this adapter or converter myself (see CONTRIBUTING.md)
